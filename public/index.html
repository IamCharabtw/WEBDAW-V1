<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebDAW — Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- TOOLBAR -->
  <header class="toolbar">
    <div class="toolbar-brand">
      <span class="brand-icon">◈</span>
      <span class="brand-name">WebDAW</span>
    </div>

    <div class="toolbar-transport">
      <button class="btn-transport" id="btn-rewind" title="Rewind">⏮</button>
      <button class="btn-transport btn-play" id="btn-play" title="Play/Stop">▶</button>
      <button class="btn-transport" id="btn-record" title="Record">⏺</button>
      <button class="btn-transport" id="btn-loop" title="Loop">🔁</button>
    </div>

    <div class="toolbar-bpm">
      <label>BPM</label>
      <div class="bpm-control">
        <button class="bpm-btn" id="bpm-down">−</button>
        <input type="number" id="bpm-value" value="128" min="40" max="300">
        <button class="bpm-btn" id="bpm-up">+</button>
      </div>
    </div>

    <div class="toolbar-timer">
      <span class="timer-display" id="timer-display">0:00.00</span>
      <div class="timer-sub">
        <span id="bar-beat">BAR 1 : BEAT 1</span>
      </div>
    </div>

    <div class="toolbar-master">
      <label>MASTER VOL</label>
      <input type="range" id="master-vol" min="0" max="1" step="0.01" value="0.8" class="slider-h">
    </div>

    <div class="toolbar-actions">
      <button class="btn-action" id="btn-new">NEW</button>
      <button class="btn-action" id="btn-save">SAVE</button>
      <button class="btn-action btn-primary" id="btn-load">LOAD</button>
      <input type="file" id="load-file" accept=".json" style="display:none">
    </div>
  </header>

  <!-- MAIN LAYOUT -->
  <main class="daw-layout">

    <!-- BROWSER -->
    <aside class="browser-panel" id="browser-panel">
      <div class="panel-header">
        <span>BROWSER</span>
        <button class="panel-toggle" id="browser-toggle">◀</button>
      </div>
      <div class="browser-search">
        <input type="text" placeholder="Search sounds..." id="browser-search">
      </div>
      <div class="browser-categories">
        <button class="cat-btn active" data-cat="drums">🥁 DRUMS</button>
        <button class="cat-btn" data-cat="synth">🎹 SYNTH</button>
        <button class="cat-btn" data-cat="bass">🎸 BASS</button>
        <button class="cat-btn" data-cat="fx">✨ FX</button>
        <button class="cat-btn" data-cat="user">📁 USER</button>
      </div>
      <div class="browser-list" id="browser-list">
        <!-- Populated by JS -->
      </div>
      <div class="browser-upload">
        <label class="upload-label" for="sample-upload">
          ⊕ Load Sample (.wav/.mp3)
        </label>
        <input type="file" id="sample-upload" accept=".wav,.mp3,.ogg" multiple>
      </div>
    </aside>

    <!-- SEQUENCER + PIANO ROLL AREA -->
    <section class="center-panel">

      <!-- PATTERN TABS -->
      <div class="pattern-bar">
        <span class="pattern-label">PATTERNS</span>
        <div class="pattern-tabs" id="pattern-tabs"></div>
        <button class="btn-add-pattern" id="btn-add-pattern">+ ADD</button>
        <div class="pattern-mode-btns">
          <button class="mode-btn active" id="mode-sequencer">STEP SEQ</button>
          <button class="mode-btn" id="mode-piano">PIANO ROLL</button>
        </div>
      </div>

      <!-- STEP SEQUENCER -->
      <div class="sequencer-container" id="sequencer-view">
        <div class="seq-header">
          <div class="seq-channel-label">CHANNELS</div>
          <div class="seq-steps-header" id="seq-steps-header">
            <!-- Step numbers -->
          </div>
          <div class="seq-controls-header">
            <span>VOL</span><span>PAN</span>
          </div>
        </div>
        <div class="seq-channels" id="seq-channels">
          <!-- Channels rendered by JS -->
        </div>
        <div class="seq-footer">
          <button class="btn-sm" id="btn-add-channel">+ ADD CHANNEL</button>
          <div class="steps-control">
            <label>STEPS</label>
            <select id="steps-count">
              <option value="8">8</option>
              <option value="16" selected>16</option>
              <option value="32">32</option>
            </select>
          </div>
          <div class="swing-control">
            <label>SWING</label>
            <input type="range" id="swing" min="0" max="100" value="0" class="slider-h">
            <span id="swing-val">0%</span>
          </div>
        </div>
      </div>

      <!-- PIANO ROLL (hidden by default) -->
      <div class="piano-roll-container hidden" id="piano-roll-view">
        <div class="piano-keys" id="piano-keys"></div>
        <div class="roll-grid" id="roll-grid">
          <canvas id="roll-canvas"></canvas>
        </div>
      </div>

      <!-- WAVEFORM / VISUALIZER -->
      <div class="visualizer-bar">
        <canvas id="visualizer-canvas"></canvas>
        <div class="vis-info">
          <span id="vis-channel-name">— Select a channel —</span>
        </div>
      </div>

    </section>

    <!-- MIXER -->
    <aside class="mixer-panel" id="mixer-panel">
      <div class="panel-header">
        <span>MIXER</span>
        <button class="panel-toggle" id="mixer-toggle">▶</button>
      </div>
      <div class="mixer-channels" id="mixer-channels">
        <!-- Generated by JS -->
      </div>
      <div class="mixer-master">
        <div class="master-channel">
          <div class="fader-wrap">
            <input type="range" class="fader-v" id="master-fader" min="0" max="127" value="100" orient="vertical">
          </div>
          <div class="channel-meter" id="master-meter">
            <div class="meter-bar"></div>
          </div>
          <span class="ch-name">MASTER</span>
        </div>
      </div>
    </aside>

  </main>

  <!-- BOTTOM STATUS BAR -->
  <footer class="status-bar">
    <span id="status-msg">Ready — Click a step to activate it, then press Play</span>
    <span class="status-right">
      <span id="cpu-usage">CPU: 0%</span>
      &nbsp;|&nbsp;
      WebDAW v1.0
    </span>
  </footer>

  <!-- CONTEXT MENU -->
  <div class="context-menu hidden" id="context-menu">
    <button data-action="rename">Rename Channel</button>
    <button data-action="duplicate">Duplicate Channel</button>
    <button data-action="clear">Clear Steps</button>
    <button data-action="delete">Delete Channel</button>
    <hr>
    <button data-action="fill">Fill All Steps</button>
    <button data-action="randomize">Randomize</button>
  </div>

  <script src="js/audio-engine.js"></script>
  <script src="js/sequencer.js"></script>
  <script src="js/mixer.js"></script>
  <script src="js/piano-roll.js"></script>
  <script src="js/project.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
